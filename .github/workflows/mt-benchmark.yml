name: Temporary MSBuild benchmark

on:
  push:
    branches: [damianedwards-jubilant-barnacle]

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - uses: actions/setup-dotnet@55ec9447dda3d1cf6bd587150f3262f30ee10815 # v3
        with:
          dotnet-version: |
            6.0.x
            7.0.x
          global-json-file: "./global.json"
      - name: Alternate equivalent CI builds
        shell: bash
        run: |
          set -euo pipefail
          dotnet --info
          echo "Runner: $ImageOS $ImageVersion; CPUs: $(nproc)"
          root="$RUNNER_TEMP/mt-benchmark"
          mkdir -p "$root"
          number=0
          for mode in normal mt mt normal normal mt; do
            number=$((number + 1))
            dir="$root/$number"
            mkdir -p "$dir"
            git archive "$GITHUB_SHA" | tar -x -C "$dir"
            (
              cd "$dir"
              dotnet restore > "$root/restore-$number.log" 2>&1 || { cat "$root/restore-$number.log"; exit 1; }
              flag=()
              if [[ "$mode" == mt ]]; then flag=(-mt); fi
              start=$(date +%s%N)
              dotnet build --configuration Release --no-restore -p:BuildNumber=20261127.1 -p:SourceRevisionId="$GITHUB_SHA" -p:ContinuousIntegrationBuild=true "${flag[@]}" > "$root/build-$number.log" 2>&1 || { cat "$root/build-$number.log"; exit 1; }
              end=$(date +%s%N)
              dotnet test --configuration Release --no-restore --no-build > "$root/test-$number.log" 2>&1 || { cat "$root/test-$number.log"; exit 1; }
              for projectPath in ./samples/**/*.csproj; do
                for tfm in net6.0 net7.0; do
                  projectFileName=${projectPath##*/}
                  projectName=${projectFileName%.*}
                  dotnet publish "$projectPath" --output "./artifacts/$projectName/$tfm" --framework "$tfm" --configuration Release --no-build --verbosity normal > "$root/publish-$number-$projectName-$tfm.log" 2>&1 || { cat "$root/publish-$number-$projectName-$tfm.log"; exit 1; }
                done
              done
              dotnet pack --configuration Release --output ./artifacts/ci --verbosity normal -p:BuildNumber=20261127.1 -p:SourceRevisionId="$GITHUB_SHA" -p:ContinuousIntegrationBuild=true > "$root/pack-$number.log" 2>&1 || { cat "$root/pack-$number.log"; exit 1; }
              dotnet pack --configuration Release --output ./artifacts/ship --verbosity normal -p:BuildNumber=20261127.1 -p:SourceRevisionId="$GITHUB_SHA" -p:ContinuousIntegrationBuild=true -p:IsShipCandidate=true > "$root/ship-$number.log" 2>&1 || { cat "$root/ship-$number.log"; exit 1; }
              finish=$(date +%s%N)
              test -n "$(find artifacts/ci -name '*.nupkg' -print -quit)"
              test -n "$(find artifacts/ship -name '*.nupkg' -print -quit)"
              echo "SAMPLE $number $mode build_ns=$((end-start)) workload_ns=$((finish-start))"
              grep 'Passed!' "$root/test-$number.log"
            )
          done
